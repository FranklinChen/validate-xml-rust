---
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            libxml2_install: sudo apt-get update && sudo apt-get install -y libxml2-dev pkg-config
          - os: macos-latest
            libxml2_install: |
              brew install libxml2 pkg-config
              echo "PKG_CONFIG_PATH=$(brew --prefix libxml2)/lib/pkgconfig" >> "$GITHUB_ENV"
          - os: windows-latest
            libxml2_install: |
              vcpkg install libxml2:x64-windows
              $root = $env:VCPKG_INSTALLATION_ROOT
              echo "LIB=$root\installed\x64-windows\lib;$env:LIB" >> $env:GITHUB_ENV
              echo "PATH=$root\installed\x64-windows\bin;$env:PATH" >> $env:GITHUB_ENV

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust dependencies and build artifacts
      uses: Swatinem/rust-cache@v2

    - name: Install libxml2
      run: ${{ matrix.libxml2_install }}

    - name: Record selected libxml2
      if: runner.os != 'Windows'
      run: |
        rustc --version
        pkg-config --modversion libxml-2.0
        pkg-config --libs --cflags libxml-2.0

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Lint
      run: cargo clippy --locked --all-targets --all-features -- -D warnings

    - name: Build
      run: cargo build --locked --release

    - name: Verify Homebrew libxml2 linkage
      if: runner.os == 'macOS'
      run: |
        linked=$(otool -L target/release/validate-xml | awk '/libxml2/{print $1}')
        prefix=$(brew --prefix libxml2)
        case "$linked" in
          "$prefix"/*) ;;
          *) echo "Expected Homebrew libxml2 under $prefix, got $linked"; exit 1 ;;
        esac

    - name: Record Linux libxml2 linkage
      if: runner.os == 'Linux'
      run: ldd target/release/validate-xml | grep libxml2

    - name: Run tests
      run: cargo test --locked --all-features
