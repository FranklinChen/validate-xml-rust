[package]
name = "validate-xml"
version = "0.4.0"
authors = ["Franklin Chen <franklinchen@franklinchen.com>"]
edition = "2024"
rust-version = "1.98"
license = "MIT"

[[bin]]
name = "validate-xml"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.53", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }

# Caching (moka for memory, cacache for disk persistence)
moka = { version = "0.12", features = ["future"] }
cacache = { version = "13.1", features = ["tokio", "futures", "tokio-stream"], default-features = false }
futures = "0.3"

# HTTP client (fully async)
reqwest = { version = "0.13", features = ["stream"] }
url = "2.5"

# Error handling
thiserror = "2.0"

# CLI
clap = { version = "4.6", features = ["derive"] }

# Streaming XML pull-parser (for schema-URL extraction from XML prologs)
quick-xml = "0.42"

# Progress reporting
indicatif = "0.18"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"

# Utilities
dirs = "6.0"
chrono = { version = "0.4", features = ["serde"] }
globset = "0.4.20"
ignore = "0.4"

[dev-dependencies]
# Testing dependencies
tempfile = "3.27"
divan = "0.1.21"

[build-dependencies]
pkg-config = "0.3.34"

[[bench]]
name = "xml_benchmark"
harness = false
